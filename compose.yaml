name: agencyzero
services:
  mcp:
    build: ./mcp
    networks: [lab]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  bob-proxy:
    build: ./llm/bob-provider
    env_file: .env
    ports:
      - "127.0.0.1:8989:8989"
    networks: [lab]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8989), timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  opencode:
    build: ./agents/opencode
    init: true
    environment:
      AGENCYZERO_OPENCODE_PROXY_URL: http://bob-proxy:8989/v1
    networks: [lab]
    depends_on:
      bob-proxy:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128

networks:
  lab:
    driver: bridge
