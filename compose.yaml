name: agencyzero
services:
  mcp:
    build: ./mcp
    networks: [lab]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      CALLED_FILE: /tmp/called.jsonl
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  bob-proxy:
    build: ./llm/bob-provider
    env_file: .env
    ports:
      - "127.0.0.1:8989:8989"
    networks: [lab]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8989), timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:stable@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d}
    command:
      - sh
      - -c
      - |
        hermes config set model.provider custom >/dev/null &&
        hermes config set model.base_url http://bob-proxy:8989/v1 >/dev/null &&
        hermes config set model.api_key bob-proxy >/dev/null &&
        hermes config set model.default "$${HERMES_MODEL:-premium}" >/dev/null &&
        hermes config set model.context_length "$${HERMES_CONTEXT_LENGTH:-128000}" >/dev/null &&
        hermes config set mcp_servers.lab.url http://mcp:8000/mcp >/dev/null &&
        if [ "$${HERMES_INSPECTOR_ENABLED:-false}" = "true" ]; then
          hermes plugins enable inspector >/dev/null && inspector=on
        else
          hermes plugins disable inspector >/dev/null 2>&1 || true
          inspector=off
        fi &&
        if [ -n "$${HERMES_LANGFUSE_PUBLIC_KEY:-}" ]; then
          { hermes plugins list 2>/dev/null | grep -q langfuse ||
            hermes plugins install langfuse --yes-deps --no-enable >/dev/null; } &&
          hermes plugins enable langfuse >/dev/null && tracing=langfuse
        else
          hermes plugins disable langfuse >/dev/null 2>&1; tracing=off
        fi &&
        echo "[hermes] provider: bob-proxy ($${HERMES_MODEL:-premium}), mcp: lab, tracing: $${tracing:-off}, inspector: $${inspector:-off}" &&
        exec sleep infinity
    working_dir: /opt/data/workspace
    environment:
      HERMES_MODEL: ${HERMES_MODEL:-premium}
      HERMES_CONTEXT_LENGTH: ${HERMES_CONTEXT_LENGTH:-128000}
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_INSPECTOR_ENABLED: "false"
    volumes:
      # Named volume: Hermes keeps a Unix socket and permission-checked files here
      - hermes_home:/opt/data
      - ./data/logs:/opt/data/logs
      - ./data/workspace:/opt/data/workspace
      - ./plugins/inspector:/opt/data/plugins/inspector:ro
    networks: [lab]
    depends_on:
      bob-proxy:
        condition: service_healthy
      mcp:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 256

volumes:
  hermes_home:
networks:
  lab:
    driver: bridge
